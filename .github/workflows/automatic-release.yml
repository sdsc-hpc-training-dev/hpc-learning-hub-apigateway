name: Release Branch Automation

on:
  pull_request_target:
    branches: [dev]
    types: [closed]

permissions:
  contents: write

jobs:
  create-branch:
    name: Create release branch
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'release: ')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Create branch from release PR
        shell: bash
        run: |
          version="${PR_TITLE#release: }"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a PR title like: release: 1.2.3"
            exit 1
          fi

          branch="release/$version"
          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent 2>/dev/null; then
            echo "::notice::$branch already exists"
            exit 0
          fi

          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$branch" \
            -f sha="$MERGE_SHA"
