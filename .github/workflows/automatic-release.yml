name: Release Branch Automation

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  create-branch:
    name: Create or update release branch
    if: >-
      startsWith(github.event.head_commit.message, 'RELEASE-')
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.release.outputs.source-sha }}
      version: ${{ steps.release.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Create or update branch from release commit
        id: release
        shell: bash
        run: |
          commit_subject="${COMMIT_MESSAGE%%$'\n'*}"
          version="${commit_subject#RELEASE-}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a commit subject like: RELEASE-1.2.3"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          branch="release/v$version"
          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent 2>/dev/null; then
            echo "::notice::Updating $branch to $COMMIT_SHA"
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" \
              -f sha="$COMMIT_SHA" \
              -F force=true
          else
            gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$branch" \
              -f sha="$COMMIT_SHA"
          fi

          echo "source-sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build and publish release image
    needs: create-branch
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/automatic-dev-image.yml
    with:
      source-sha: ${{ needs.create-branch.outputs.source-sha }}
      version: ${{ needs.create-branch.outputs.version }}
