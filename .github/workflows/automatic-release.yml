name: Release Branch Automation

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  create-branch:
    name: Create release branch
    if: >-
      startsWith(github.event.head_commit.message, 'RELEASE-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Create branch from release commit
        shell: bash
        run: |
          commit_subject="${COMMIT_MESSAGE%%$'\n'*}"
          version="${commit_subject#RELEASE-}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a commit subject like: RELEASE-1.2.3"
            exit 1
          fi

          branch="RELEASE-$version"
          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent 2>/dev/null; then
            echo "::notice::$branch already exists"
            exit 0
          fi

          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$branch" \
            -f sha="$COMMIT_SHA"
