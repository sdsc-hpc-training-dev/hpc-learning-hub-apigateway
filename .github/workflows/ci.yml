name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      debt_comment_count: ${{ steps.debt_comments.outputs.count }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Count TODO and FIXME comments
        id: debt_comments
        shell: bash
        run: |
          matches="$(git grep -Eoh 'TODO|FIXME' -- src || true)"
          if [ -z "$matches" ]; then
            count=0
          else
            count="$(printf '%s\n' "$matches" | wc -l)"
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: npm run lint:check

  typecheck:
    name: Type check (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      uncovered_percentage: ${{ steps.coverage_metrics.outputs.uncovered_percentage }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:cov

      - name: Enforce configured coverage thresholds
        id: coverage_metrics
        if: ${{ !cancelled() }}
        run: |
          node -e "
            const fs = require('node:fs');
            const reportPath = './coverage/coverage-summary.json';
            if (!fs.existsSync(reportPath)) {
              console.error('Coverage summary was not generated.');
              process.exit(1);
            }
            const summary = require(reportPath).total;
            const thresholds = require('./package.json').jest.coverageThreshold.global;
            const lineCoverage = summary.lines?.pct;
            if (typeof lineCoverage !== 'number') {
              console.error('Line coverage percentage is unavailable.');
              process.exit(1);
            }
            const uncovered = Math.max(0, Number((100 - lineCoverage).toFixed(2)));
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              'uncovered_percentage=' + uncovered + '\n',
            );
            let failed = false;
            for (const [metric, minimum] of Object.entries(thresholds)) {
              const actual = summary[metric]?.pct;
              if (typeof actual !== 'number' || actual < minimum) {
                console.error(
                  'Coverage for ' + metric + ' is ' + actual +
                  '%, below required ' + minimum + '%',
                );
                failed = true;
              }
            }
            if (failed) process.exit(1);
          "

      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/lcov-report/**
            coverage/coverage-final.json
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  duplication:
    name: Duplicate code (jscpd)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      duplicated_lines: ${{ steps.duplication_metrics.outputs.duplicated_lines }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check duplicated code
        run: npm run duplicates:check

      - name: Read duplicated line count
        id: duplication_metrics
        if: ${{ !cancelled() }}
        run: |
          node -e "
            const fs = require('node:fs');
            const reportPath = './reports/jscpd/jscpd-report.json';
            if (!fs.existsSync(reportPath)) {
              console.error('jscpd JSON report was not generated.');
              process.exit(1);
            }
            const report = require(reportPath);
            const duplicatedLines = report.statistics?.total?.duplicatedLines;
            if (!Number.isInteger(duplicatedLines) || duplicatedLines < 0) {
              console.error('Duplicated line count is unavailable.');
              process.exit(1);
            }
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              'duplicated_lines=' + duplicatedLines + '\n',
            );
          "

      - name: Upload duplication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplication-report
          path: reports/jscpd
          retention-days: 14

  unused:
    name: Unused code and dependencies (Knip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      unused_code_count: ${{ steps.unused_code.outputs.count }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and count unused code
        id: unused_code
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/knip --reporter json > "$RUNNER_TEMP/knip-report.json"
          knip_status=$?
          set -e

          cat "$RUNNER_TEMP/knip-report.json"
          KNIP_REPORT_PATH="$RUNNER_TEMP/knip-report.json" node -e "
            const fs = require('node:fs');
            const report = JSON.parse(
              fs.readFileSync(process.env.KNIP_REPORT_PATH, 'utf8'),
            );
            const unusedTypes = [
              'files',
              'exports',
              'nsExports',
              'types',
              'nsTypes',
              'enumMembers',
              'namespaceMembers',
              'duplicates',
            ];
            const count = report.issues.reduce(
              (total, issue) =>
                total +
                unusedTypes.reduce(
                  (subtotal, type) => subtotal + (issue[type]?.length ?? 0),
                  0,
                ),
              0,
            );
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'count=' + count + '\n');
          "

          exit "$knip_status"

  audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'
          cache: false

      - name: Install Gitleaks
        env:
          GOBIN: ${{ runner.temp }}/gitleaks
        run: |
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.30.0

      - name: Scan Git history for secrets
        run: >
          ${{ runner.temp }}/gitleaks/gitleaks
          git
          --redact
          --verbose
          .

  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.172.0

      - name: Run Semgrep security scan
        run: semgrep scan --config p/security-audit --metrics=off --error .

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  container_scan:
    name: Docker image scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root Dockerfile found; skipping the image scan."
          fi

      - name: Build API Gateway image
        if: steps.dockerfile.outputs.exists == 'true'
        run: docker build -t hpc-learning-hub-apigateway:ci .

      - name: Scan image with Trivy
        if: steps.dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: hpc-learning-hub-apigateway:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  technical_debt:
    name: Technical debt indicator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - lint
      - test
      - duplication
      - unused
    outputs:
      score: ${{ steps.calculate.outputs.score }}

    steps:
      - name: Calculate technical debt score
        id: calculate
        env:
          UNCOVERED_PERCENTAGE: ${{ needs.test.outputs.uncovered_percentage }}
          DUPLICATED_LINES: ${{ needs.duplication.outputs.duplicated_lines }}
          DEBT_COMMENT_COUNT: ${{ needs.lint.outputs.debt_comment_count }}
          UNUSED_CODE_COUNT: ${{ needs.unused.outputs.unused_code_count }}
        shell: bash
        run: |
          metrics=(
            "uncovered_percentage=$UNCOVERED_PERCENTAGE"
            "duplicated_lines=$DUPLICATED_LINES"
            "debt_comments=$DEBT_COMMENT_COUNT"
            "unused_code=$UNUSED_CODE_COUNT"
          )

          for metric in "${metrics[@]}"; do
            name="${metric%%=*}"
            value="${metric#*=}"
            if [[ ! "$value" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "::error::$name is unavailable"
              exit 1
            fi
          done

          score="$(awk -v uncovered="$UNCOVERED_PERCENTAGE" \
            -v duplicated="$DUPLICATED_LINES" \
            -v comments="$DEBT_COMMENT_COUNT" \
            -v unused="$UNUSED_CODE_COUNT" \
            'BEGIN { printf "%.2f", uncovered + duplicated + comments + unused }')"

          echo "score=$score" >> "$GITHUB_OUTPUT"
          {
            echo "## Technical debt indicator"
            echo
            echo "| Component | Value |"
            echo "| --- | ---: |"
            echo "| Uncovered lines | $UNCOVERED_PERCENTAGE% |"
            echo "| Duplicated lines | $DUPLICATED_LINES |"
            echo "| TODO/FIXME comments | $DEBT_COMMENT_COUNT |"
            echo "| Unused-code findings | $UNUSED_CODE_COUNT |"
            echo "| **Total score** | **$score** |"
            echo
            echo "Higher scores indicate more technical debt; zero is ideal."
          } >> "$GITHUB_STEP_SUMMARY"

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - format
      - lint
      - typecheck
      - test
      - duplication
      - unused
      - audit
      - secrets
      - semgrep
      - build
      - container_scan
      - technical_debt

    steps:
      - name: Verify all CI jobs succeeded
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DUPLICATION_RESULT: ${{ needs.duplication.result }}
          UNUSED_RESULT: ${{ needs.unused.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TRIVY_RESULT: ${{ needs.container_scan.result }}
          TECHNICAL_DEBT_RESULT: ${{ needs.technical_debt.result }}
        run: |
          checks=(
            "format=$FORMAT_RESULT"
            "lint=$LINT_RESULT"
            "typecheck=$TYPECHECK_RESULT"
            "test=$TEST_RESULT"
            "duplication=$DUPLICATION_RESULT"
            "unused=$UNUSED_RESULT"
            "audit=$AUDIT_RESULT"
            "secrets=$SECRETS_RESULT"
            "semgrep=$SEMGREP_RESULT"
            "build=$BUILD_RESULT"
            "container_scan=$TRIVY_RESULT"
            "technical_debt=$TECHNICAL_DEBT_RESULT"
          )

          failed=0
          for check in "${checks[@]}"; do
            name="${check%%=*}"
            result="${check#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::$name finished with status $result"
              failed=1
            fi
          done

          exit "$failed"
