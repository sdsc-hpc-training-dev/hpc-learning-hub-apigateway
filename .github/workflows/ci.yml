name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Type-check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests with coverage
        run: npm run test:cov

      - name: Check duplicated code
        run: npm run duplicates:check

      - name: Check unused code and dependencies
        run: npm run unused:check

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 14

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'
          cache: false

      - name: Install Gitleaks
        env:
          GOBIN: ${{ runner.temp }}/gitleaks
        run: |
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.30.0

      - name: Scan Git history for secrets
        run: >
          ${{ runner.temp }}/gitleaks/gitleaks
          git
          --redact
          --verbose
          .

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.172.0

      - name: Run Semgrep security scan
        run: semgrep scan --config p/security-audit --metrics=off --error .

      - name: Build
        run: npm run build
